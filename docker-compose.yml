services:
  db:
    image: postgis/postgis:16-3.4
    container_name: pawconnect-db
    environment:
      POSTGRES_USER: pawconnect
      POSTGRES_PASSWORD: pawconnect
      POSTGRES_DB: pawconnect
    ports:
      - "5432:5432"
    volumes:
      - pawconnect_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pawconnect"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pawconnect_pgdata:
